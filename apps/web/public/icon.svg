<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 1000 1000" role="img" aria-label="HOC">
  <rect width="1000" height="1000" rx="220" fill="#1b2b4b"/>
  <g transform="translate(-35,85)">
<!-- ===== Monograma HOC (coordenadas medidas do original, escala 1000/1254) ===== -->
  <!-- H : barras x 204 / 351, y 309.4-517.6, crossbar y 411.9 -->
  <g fill="none" stroke="#ffffff" stroke-width="13.5" stroke-linecap="round">
    <line x1="204.2" y1="309.4" x2="204.2" y2="517.6"/>
    <line x1="350.9" y1="309.4" x2="350.9" y2="517.6"/>
    <line x1="204.2" y1="411.9" x2="350.9" y2="411.9"/>
  </g>

  <!-- O : centro (501.6, 414.7) r 102.9 -->
  <circle cx="501.6" cy="414.7" r="102.9" fill="none" stroke="#ffffff" stroke-width="13.5"/>

  <!-- C : centro (738.5, 413.9) r 99.4, abertura a direita (±51°) -->
  <path d="M 800.5 336.2 A 99.4 99.4 0 1 0 800.5 491.6"
        fill="none" stroke="#ffffff" stroke-width="13.5" stroke-linecap="round"/>

  <!-- Halo: abre o O nas travessias e o C ao longo do degrau/cauda -->
  <g fill="none" stroke="#1b2b4b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 397 439.4 H 440"/>
    <path d="M 556 423.3 H 604"/>
    <path d="M 610 423.3 H 638.8 L 652 462.9 A 99.4 99.4 0 0 0 667 483.5"/>
  </g>

  <!-- Linha ECG dourada : pico centrado no O, cauda sobreposta ao arco do C -->
  <path d="M 395.6 439.4 H 450 L 461 433 L 476.9 454.6
           L 501.6 309.5 L 533.5 464 L 562 423.3
           H 638.8 L 652 462.9
           A 99.4 99.4 0 0 0 672 486.7"
        fill="none" stroke="#C9A877" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

    </g>
</svg>
