name: Mobile CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['apps/mobile/**']

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Platform folders (android/ios) are generated in CI; only lib/ + test/ are versioned.
      - run: flutter create --platforms=android,ios --project-name pedia .
      # Drop the default scaffold test (references a non-existent MyApp).
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      # Format applied (non-blocking) until a pre-commit dartfmt hook lands.
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
