name: Web CI

on:
  push:
    branches: [main, "claude/**"]
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["apps/web/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # eslint-plugin-jsx-a11y: keeps the WCAG 2.2 regressions that a linter can
      # actually catch (missing labels, click-only handlers) out of the app.
      - run: npm run lint
      # Guards the Home assistant's red-flag detection (the 112 / SNS 24
      # escalation). A silent regression there is a patient-safety issue.
      - run: npm test
      # next build runs the TypeScript type-checker as part of the build.
      - run: npm run build
